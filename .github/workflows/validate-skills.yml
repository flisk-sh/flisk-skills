name: Validate skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test skill validation
        run: node --test scripts/validate-skills.test.mjs
      - name: Validate skills
        run: node scripts/validate-skills.mjs
