name: Validate skills

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test skill validation
        run: node --test scripts/validate-skills.test.mjs
      - name: Validate skills
        run: node scripts/validate-skills.mjs
      - name: Test README link checking
        run: node --test scripts/check-readme-links.test.mjs
      - name: Check README links
        run: node scripts/check-readme-links.mjs
      - name: Test demo host check
        run: node --test scripts/check-demo-host.test.mjs
      - name: Check demo host references
        run: node scripts/check-demo-host.mjs
